<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AquaFlow - Owner Dashboard | Settings</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="admin-layout">
    <div id="sidebarBackdrop" class="sidebar-backdrop" onclick="toggleSidebar(false)"></div>

    <aside class="admin-sidebar no-print" id="adminSidebar">
      <div class="sidebar-header">
        <div class="sidebar-header-brand">
          <div class="sidebar-brand-badge">AF</div>
          <div>
            <h2 id="brandName" class="sidebar-brand-title">AquaFlow</h2>
            <p class="sidebar-brand-subtitle">Station Owner Portal</p>
          </div>
        </div>
        <button class="sidebar-close-btn" onclick="toggleSidebar(false)" aria-label="Close Sidebar">&times;</button>
      </div>

      <nav class="sidebar-nav" id="sideNav">
        <a href="dashboard.html" data-s="dash" class="sidebar-link"><span>Dashboard</span></a>
        <a href="sales.html" data-s="sales" class="sidebar-link"><span>Sales &amp; POS Logs</span></a>
        <a href="arima.html" data-s="arima" class="sidebar-link"><span>ARIMA Analytics</span><span class="pill pill-info">ARIMA</span></a>
        <a href="inventory.html" data-s="inv" class="sidebar-link"><span>Consumables &amp; ROP</span></a>
        <a href="customers.html" data-s="cust" class="sidebar-link"><span>Customer Liabilities</span></a>
        <a href="suppliers.html" data-s="sup" class="sidebar-link"><span>Suppliers</span></a>
        <a href="users.html" data-s="users" class="sidebar-link"><span>Users &amp; Access</span></a>
        <a href="settings.html" data-s="settings" class="sidebar-link active"><span>Settings</span></a>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user-card">
          <span class="sidebar-user-label">Active Session</span>
          <b class="sidebar-user-name" id="who">Owner</b>
        </div>
        <div class="sidebar-action-row">
          <a href="../CASHIER/index.html" class="sidebar-pos-link">POS Terminal</a>
          <button onclick="logout()" class="sidebar-logout-btn">Logout</button>
        </div>
      </div>
    </aside>

    <div class="admin-main-container">
      <header class="admin-topbar no-print">
        <div class="admin-topbar-left">
          <button id="sidebarToggleBtn" class="sidebar-toggle-btn" onclick="toggleSidebar()" aria-label="Toggle Navigation Menu">
            <span class="hamburger-bar"></span>
            <span class="hamburger-bar"></span>
            <span class="hamburger-bar"></span>
          </button>
          <h1 class="admin-topbar-title" id="pageTitle">Settings</h1>
        </div>
        <div class="admin-topbar-meta">
          <span id="adminClock"></span>
        </div>
      </header>

      <main class="admin-main-content">
        <section id="s-settings">
          <h2 class="auth-title">Settings</h2>
          <div class="card auth-form settings-card">
            <div>
              <label class="form-label">Station name</label>
              <input id="setStation" value="AquaFlow Station" class="form-input">
            </div>
            <div>
              <label class="form-label">Days until new supplies arrive (restock time)</label>
              <input id="setLead" type="number" value="3" class="form-input">
            </div>
            <div>
              <label class="form-label">Target app rating (SUS)</label>
              <input id="setSus" value="81.67 (Grade A)" class="form-input">
            </div>
            <button onclick="saveSettings()" class="btn btn-primary order-type-selector">Save Settings</button>
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- Data & Authentication Layers -->
  <script src="../js/data/initial-data.js"></script>
  <script src="../js/data/store.js"></script>
  <script src="../js/auth/auth.js"></script>

  <!-- Owner Dashboard Modular Subsystems -->
  <script src="../js/admin/navigation.js"></script>
  <script src="../js/admin/inventory.js"></script>
  <script src="../js/admin/arima.js"></script>
  <script src="../js/admin/insights.js"></script>
  <script src="../js/admin/customers.js"></script>
  <script src="../js/admin/sales.js"></script>
  <script src="../js/admin/settings.js"></script>
  <script>
    const SESSION = bootAdminPortal('Settings');
    if (SESSION) {
      loadSettings();
    }
  </script>
</body>
</html>
