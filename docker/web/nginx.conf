# AquaFlow presentation tier (Tier 1)
#
# nginx fronts the Laravel application: it owns the public port, applies
# security headers, and forwards requests to the application tier. Laravel
# renders the presentation (Blade views); nginx terminates and hardens it.

upstream aquaflow_app {
    server app:80;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 2m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    # Long-lived static assets
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        proxy_pass http://aquaflow_app;
        proxy_cache_valid 200 10m;
        expires 1h;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://aquaflow_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # Forecast runs can take a couple of minutes.
        proxy_read_timeout 300s;
    }
}
